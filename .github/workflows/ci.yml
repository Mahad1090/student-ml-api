name: CI

# Runs on every pull request targeting main, and on pushes to feature
# branches. It validates the code but never publishes an artifact.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore:
      - main

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run pytest
        run: pytest -q

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (validation only, no push)
        run: |
          docker build \
            --build-arg APP_VERSION="$(cat VERSION)" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t student-ml-api:ci .
